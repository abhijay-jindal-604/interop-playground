<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="t d">
<title id="t">Data flow of one run</title>
<desc id="d">A CreateRunRequest becomes an immutable RunSpec, the orchestrator runs its steps through adapters, captured exchanges become events that the sink redacts and persists before the bus publishes them over SSE to the UI reducer; diagnosis and the report read the stored log.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8d94"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8d94"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6b5c"/></marker><marker id="arrAs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0f6b5c"/></marker><marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3341f"/></marker><marker id="arrWs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a3341f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f4fb5"/></marker><marker id="arrBs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2f4fb5"/></marker></defs>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="1080" height="560" rx="12" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1c1d21" text-anchor="start">Data flow of one run</text>
<text x="24" y="58" font-size="13" font-weight="normal" fill="#5b5e66" text-anchor="start">Every view of a run (live, replay, report, diagnosis) is built from the same stored event log.</text>
<rect x="24" y="100" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="36" y="122" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">1. Selector</text>
<text x="36" y="141" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">CreateRunRequest</text>
<text x="36" y="157" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">POST /api/v1/runs</text>
<rect x="230" y="100" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="242" y="122" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">2. RunSpec</text>
<text x="242" y="141" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">resolved once, immutable;</text>
<text x="242" y="157" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">issuance + presentation flow</text>
<rect x="436" y="100" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="448" y="122" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">3. Orchestrator</text>
<text x="448" y="141" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">ordered steps from flows/;</text>
<text x="448" y="157" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">scheduler runs it</text>
<rect x="642" y="100" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="654" y="122" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">4. Adapters</text>
<text x="654" y="141" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">issuer, wallet, verifier</text>
<text x="654" y="157" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">calls per step</text>
<rect x="848" y="100" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="860" y="122" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">5. Capture</text>
<text x="860" y="141" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">CapturingHttp (out) +</text>
<text x="860" y="157" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">gateway (in): exchanges</text>
<path d="M214,137 L230,137" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M420,137 L436,137" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M626,137 L642,137" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M832,137 L848,137" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="24" y="250" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="36" y="272" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">10. UI</text>
<text x="36" y="291" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">reducer → diagram, step</text>
<text x="36" y="307" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">rail, inspector, result</text>
<rect x="230" y="250" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="242" y="272" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">9. SSE stream</text>
<text x="242" y="291" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">/streams/{runId}/events;</text>
<text x="242" y="307" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">stream.end when terminal</text>
<rect x="436" y="250" width="190" height="74" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="448" y="272" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">8. Event bus</text>
<text x="448" y="291" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">publishes in seq order,</text>
<text x="448" y="307" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">only after the write</text>
<rect x="642" y="250" width="190" height="74" rx="8" fill="#e3f1ee" stroke="#0f6b5c" stroke-width="1.2"/>
<text x="654" y="272" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">7. SQLite event log</text>
<text x="654" y="291" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">run_events table,</text>
<text x="654" y="307" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">append-only per run</text>
<rect x="848" y="250" width="190" height="74" rx="8" fill="#e3f1ee" stroke="#0f6b5c" stroke-width="1.2"/>
<text x="860" y="272" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">6. Event sink</text>
<text x="860" y="291" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">redacts secrets,</text>
<text x="860" y="307" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">then persists</text>
<path d="M848,287 L832,287" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M642,287 L626,287" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M436,287 L420,287" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M230,287 L214,287" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M943,174 L943,250" fill="none" stroke="#8a8d94" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="935" y="204" font-size="12" font-weight="normal" fill="#5b5e66" text-anchor="end">step.* · exchange.* · engine.call · verdict.check · run.*</text>
<rect x="642" y="400" width="190" height="84" rx="8" fill="#e8ecfa" stroke="#2f4fb5" stroke-width="1.2"/>
<text x="654" y="422" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">Diagnosis engine</text>
<text x="654" y="441" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">reads persisted events;</text>
<text x="654" y="457" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">writes fingerprint.matched,</text>
<text x="654" y="473" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">counterfactual.offered</text>
<rect x="848" y="400" width="190" height="84" rx="8" fill="#e8ecfa" stroke="#2f4fb5" stroke-width="1.2"/>
<text x="860" y="422" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">Report generator</text>
<text x="860" y="441" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">GET /api/v1/reports/</text>
<text x="860" y="457" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">runs/{runId}?format=</text>
<text x="860" y="473" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">json | markdown</text>
<path d="M760,324 L737,400" fill="none" stroke="#2f4fb5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrB)"/>
<path d="M800,324 L943,400" fill="none" stroke="#2f4fb5" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrB)"/>
<rect x="24" y="400" width="380" height="84" rx="8" fill="#f6f5f1" stroke="#8a8d94" stroke-width="1.2"/>
<text x="36" y="422" font-size="14" font-weight="600" fill="#1c1d21" text-anchor="start">Replay = the same path</text>
<text x="36" y="441" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">A finished run is reduced instantly from the stored log;</text>
<text x="36" y="457" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">a reconnecting client resumes with Last-Event-ID / ?after=;</text>
<text x="36" y="473" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">the UI keeps no state the log cannot rebuild.</text>
<text x="24" y="530" font-size="12.5" font-weight="normal" fill="#5b5e66" text-anchor="start">Sources: README &quot;Architecture&quot; (Events, Immutable runs, Store); apps/bff/src/{orchestrator,capture,gateway,store,stream,diagnosis,report}; apps/ui/src/state/stream.ts.</text>
</g>
</svg>
