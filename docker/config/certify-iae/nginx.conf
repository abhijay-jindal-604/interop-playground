# Certify front on 80 -> certify-iae:8090. Proxies /v1/certify/* and maps the root well-knowns onto
# /v1/certify/.well-known/* (S-018, S-184). Allowlisting is the BFF gateway's job (02 §2.3 M1);
# this front is reached only on playground_net.
server {
  listen 80;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  location /v1/certify/ {
    proxy_pass http://certify-iae:8090/v1/certify/;
  }
  location ~ ^/\.well-known/(openid-credential-issuer|oauth-authorization-server|jwks\.json|did\.json)$ {
    proxy_pass http://certify-iae:8090/v1/certify$request_uri;
  }
  # did:web:<PUBLIC_HOST>:iae is served on the 443 gateway route /iae/did.json (ADR-50)
  location = /iae/did.json {
    proxy_pass http://certify-iae:8090/v1/certify/.well-known/did.json;
  }
}
# Certify front on 81 -> certify-iae-mint:8090. Proxies /v1/certify/* and maps the root well-knowns onto
# /v1/certify/.well-known/* (S-018, S-184). Allowlisting is the BFF gateway's job (02 §2.3 M1);
# this front is reached only on playground_net.
server {
  listen 81;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  location /v1/certify/ {
    proxy_pass http://certify-iae-mint:8090/v1/certify/;
  }
  location ~ ^/\.well-known/(openid-credential-issuer|oauth-authorization-server|jwks\.json|did\.json)$ {
    proxy_pass http://certify-iae-mint:8090/v1/certify$request_uri;
  }
}
# Internal only: the DCQL vp-request config read by certify-iae and the BFF probe (S-206 default.conf)
server {
  listen 82;
  default_type application/json;
  location / {
    root /cfg;
  }
}
