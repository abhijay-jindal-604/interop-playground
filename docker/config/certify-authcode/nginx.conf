# Certify front on 80 -> certify-authcode:8090. Proxies /v1/certify/* and maps the root well-knowns onto
# /v1/certify/.well-known/* (S-018, S-184). Allowlisting is the BFF gateway's job (02 §2.3 M1);
# this front is reached only on playground_net.
server {
  listen 80;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  location /v1/certify/ {
    proxy_pass http://certify-authcode:8090/v1/certify/;
  }
  location ~ ^/\.well-known/(openid-credential-issuer|oauth-authorization-server|jwks\.json|did\.json)$ {
    proxy_pass http://certify-authcode:8090/v1/certify$request_uri;
  }
  # path-form did:web:<PUBLIC_HOST>:authcode, reached through the gateway's exact 443 route
  # GET /authcode/did.json (02 §5.6, ADR-24); the gateway itself never rewrites paths
  location = /authcode/did.json {
    proxy_pass http://certify-authcode:8090/v1/certify/.well-known/did.json;
  }
  # Mimoto config server (spring.cloud.config.uri / config.server.file.storage.uri, S-025)
  location / {
    root /config/server;
    autoindex on;
  }
}
