# datashare-service (02 §5.3, 10 §7.2, S-196). Mimoto fetches
#   http://datashare-service:8097/v1/datashare/get/static-policyid/static-subscriberid/<runId>.json
# The BFF writes <runId>.json = {format, credential} at the root of the named volume
# playground-datashare (mounted read-only here at /data) and deletes it at run end.
server {
  listen 8097;
  default_type application/json;
  root /data;
  location ~ ^/v1/datashare/get/static-policyid/static-subscriberid/(?<file>[A-Za-z0-9._-]+\.json)$ {
    try_files /$file =404;
  }
  location / {
    return 404;
  }
}
