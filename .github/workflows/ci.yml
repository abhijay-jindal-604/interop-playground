# ci.yml (plan/10 §9.1): every push and PR. ci-fast profile on fakes; no Docker stacks, no Collab,
# no tunnel. Read-only token; every action pinned by commit SHA (plan/10 §2.5).
# Steps whose script or test tree arrives with a later task are guarded by hashFiles() and switch
# on automatically when the file lands.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: lint (eslint, no-github-write, secrets, validate-flows)
        run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run contracts:check
      - name: contrast
        if: hashFiles('scripts/contrast.mjs') != ''
        run: npm run contrast
      - run: npm run check:secrets -- --all
      - run: npm run test:repo

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - run: npm run test:contract
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
      - name: shadowJar
        working-directory: sidecar
        run: ./gradlew --no-daemon shadowJar
      - name: duplicate-class check
        working-directory: sidecar
        run: |
          set -euo pipefail
          unzip -Z1 build/libs/sidecar-all.jar | grep '\.class$' | grep -v 'module-info\.class$' > classes.txt
          total=$(wc -l < classes.txt)
          unique=$(sort -u classes.txt | wc -l)
          echo "classes: $total, unique: $unique"
          test "$total" -eq "$unique"
      - name: smoke (dc+sd-jwt verify true, tamper false, ldp_vc verify true)
        working-directory: sidecar
        run: java -jar build/libs/sidecar-all.jar smoke ../fixtures/golden/s060/local-sdjwt-savekey.txt

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - name: vite build and bundle budget
        if: hashFiles('apps/ui/vite.config.ts') != ''
        run: npm run build --workspace @interop-playground/ui
      - name: Playwright e2e (chromium, a11y, diagram, visual)
        if: hashFiles('e2e/**/*.spec.ts') != ''
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --project chromium

  ci-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: playground suite run --profile ci-fast
        if: hashFiles('apps/bff/src/cli.ts') != '' && hashFiles('ci/profiles.json') != ''
        run: npm run ci:fast
      - name: matrix summary
        if: always() && hashFiles('matrix.md') != ''
        run: cat matrix.md >> "$GITHUB_STEP_SUMMARY"
