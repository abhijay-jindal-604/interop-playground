components:
  securitySchemes:
    adminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    Cascade:
      name: cascade
      in: query
      schema:
        type: boolean
        default: false
    FlowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
        pattern: ^FLOW-[0-9]{2}$
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 64
  requestBodies:
    CreateRun:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateRunRequest"
  responses:
    Error:
      description: error envelope (section 6)
      headers:
        X-Request-Id:
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    AdapterDescriptor:
      additionalProperties: false
      properties:
        coverage:
          $ref: "#/components/schemas/CoverageDecl"
        displayName:
          type: string
        envClass:
          $ref: "#/components/schemas/EnvClass"
        formats:
          items:
            $ref: "#/components/schemas/CredentialFormat"
          type: array
        id:
          $ref: "#/components/schemas/AdapterId"
        knobs:
          items:
            $ref: "#/components/schemas/KnobDef"
          type: array
        role:
          $ref: "#/components/schemas/Role"
        tier:
          $ref: "#/components/schemas/Tier"
        vendor:
          $ref: "#/components/schemas/Vendor"
      required:
        - coverage
        - displayName
        - envClass
        - formats
        - id
        - knobs
        - role
        - tier
        - vendor
      type: object
    AdapterEntry:
      additionalProperties: false
      properties:
        availability:
          $ref: "#/components/schemas/Availability"
        descriptor:
          $ref: "#/components/schemas/AdapterDescriptor"
        probedAt:
          type:
            - "null"
            - string
      required:
        - availability
        - descriptor
        - probedAt
      type: object
    AdapterId:
      enum:
        - issuer.certify-authcode
        - issuer.certify-collab
        - issuer.certify-mdoc
        - issuer.certify-preauth
        - issuer.fixture
        - issuer.waltid
        - verifier.credo
        - verifier.eudi
        - verifier.inji-verify-collab
        - verifier.inji-verify-local
        - verifier.inji-verify-sdk
        - verifier.vcverifier-offline
        - verifier.waltid
        - wallet.credo
        - wallet.inji-jvm
        - wallet.inji-mobile
        - wallet.inji-web
        - wallet.playground-ts
      type: string
    AdapterListResponse:
      additionalProperties: false
      properties:
        issuers:
          items:
            $ref: "#/components/schemas/AdapterEntry"
          type: array
        verifiers:
          items:
            $ref: "#/components/schemas/AdapterEntry"
          type: array
        wallets:
          items:
            $ref: "#/components/schemas/AdapterEntry"
          type: array
      required:
        - issuers
        - verifiers
        - wallets
      type: object
    AnyEvent:
      oneOf:
        - $ref: "#/components/schemas/Event.run.created"
        - $ref: "#/components/schemas/Event.run.started"
        - $ref: "#/components/schemas/Event.run.completed"
        - $ref: "#/components/schemas/Event.run.failed"
        - $ref: "#/components/schemas/Event.run.cancelled"
        - $ref: "#/components/schemas/Event.step.started"
        - $ref: "#/components/schemas/Event.step.completed"
        - $ref: "#/components/schemas/Event.exchange.request"
        - $ref: "#/components/schemas/Event.exchange.response"
        - $ref: "#/components/schemas/Event.exchange.error"
        - $ref: "#/components/schemas/Event.gateway.denied"
        - $ref: "#/components/schemas/Event.engine.call"
        - $ref: "#/components/schemas/Event.engine.exception"
        - $ref: "#/components/schemas/Event.verdict.check"
        - $ref: "#/components/schemas/Event.fingerprint.matched"
        - $ref: "#/components/schemas/Event.counterfactual.offered"
        - $ref: "#/components/schemas/Event.env.probe"
        - $ref: "#/components/schemas/Event.env.ready"
        - $ref: "#/components/schemas/Event.env.degraded"
        - $ref: "#/components/schemas/Event.env.fingerprint"
        - $ref: "#/components/schemas/Event.env.tunnel"
        - $ref: "#/components/schemas/Event.env.run-list"
    Artifact:
      additionalProperties: false
      properties:
        artifactId:
          description: "`<runId>:<n>`"
          type: string
        body:
          $ref: "#/components/schemas/BodyRef"
        derivedFromExchangeId:
          type:
            - "null"
            - string
        kind:
          enum:
            - credential-decoded
            - credential-raw
            - did-document
            - mdoc-envelope
            - proof-jwt
            - request-object
            - tamper-after
            - tamper-before
            - verifier-result
            - vp-token
          type: string
        mediaType:
          description: "'application/json' | 'application/jwt' | 'application/cbor' | 'text/plain'"
          type: string
        runId:
          $ref: "#/components/schemas/Ulid"
        stepKey:
          type: string
      required:
        - artifactId
        - body
        - derivedFromExchangeId
        - kind
        - mediaType
        - runId
        - stepKey
      type: object
    Availability:
      additionalProperties: false
      description: ADR-05, S-007
      properties:
        available:
          type: boolean
        reason:
          type: string
        versionFingerprint:
          type: string
      required:
        - available
        - versionFingerprint
      type: object
    AwaitingInput:
      additionalProperties: false
      description: derived from the last engine.call{op:"await-observation"}
      properties:
        deadline:
          $ref: "#/components/schemas/Iso"
          description: "the wait ends then: step fails with 'timeout', verdict 'no-submission' for presentation"
        expects:
          items:
            enum:
              - card-status
              - dcapi-holder
              - issuance
              - presentation
              - sdk-request-uri
            type: string
          type: array
        stepKey:
          type: string
      required:
        - deadline
        - expects
        - stepKey
      type: object
    BodyRef:
      additionalProperties: false
      properties:
        encoding:
          enum:
            - base64
            - utf8
          type: string
        sha256:
          description: hex of the original bytes
          type: string
        size:
          description: original byte length
          type: number
        text:
          description: inline up to 64 KiB in events; up to 256 KiB (the stored cap) in API-27 (ADR-37)
          type: string
        truncated:
          type: boolean
      required:
        - encoding
        - sha256
        - size
        - text
        - truncated
      type: object
    BodyState:
      description: "'none': no body; 'stored': `body` present; 'pruned': deleted by retention; 'dropped_run_cap': per-run budget exhausted (05 §4.3, §5)"
      enum:
        - dropped_run_cap
        - none
        - pruned
        - stored
      type: string
    CapturedMessage:
      additionalProperties: false
      description: one HTTP exchange (request + response, request + error)
      properties:
        actor:
          description: like 'wallet.playground-ts', 'mimoto→certify-authcode'
          type: string
        capture:
          $ref: "#/components/schemas/Coverage"
        counterpart:
          type: string
        direction:
          enum:
            - inbound
            - outbound
          type: string
        error:
          anyOf:
            - additionalProperties: false
              properties:
                durationMs:
                  type: number
                errorClass:
                  type: string
                message:
                  type: string
              required:
                - durationMs
                - errorClass
                - message
              type: object
            - type: "null"
          description: exactly one of response / error is set
        exchangeId:
          description: "`<runId>:<n>`"
          type: string
        poll:
          anyOf:
            - $ref: "#/components/schemas/PollInfo"
            - type: "null"
          description: 04 §8.3
        request:
          additionalProperties: false
          properties:
            at:
              $ref: "#/components/schemas/Iso"
            body:
              anyOf:
                - $ref: "#/components/schemas/BodyRef"
                - type: "null"
            bodyState:
              $ref: "#/components/schemas/BodyState"
            headers:
              $ref: "#/components/schemas/Headers"
            method:
              type: string
            url:
              type: string
          required:
            - at
            - body
            - bodyState
            - headers
            - method
            - url
          type: object
        response:
          anyOf:
            - additionalProperties: false
              properties:
                at:
                  $ref: "#/components/schemas/Iso"
                body:
                  anyOf:
                    - $ref: "#/components/schemas/BodyRef"
                    - type: "null"
                bodyState:
                  $ref: "#/components/schemas/BodyState"
                durationMs:
                  type: number
                headers:
                  $ref: "#/components/schemas/Headers"
                status:
                  type: number
                statusText:
                  type:
                    - "null"
                    - string
              required:
                - at
                - body
                - bodyState
                - durationMs
                - headers
                - status
                - statusText
              type: object
            - type: "null"
        runId:
          $ref: "#/components/schemas/Ulid"
        stepKey:
          description: null only in the 'unattributed' stream
          type:
            - "null"
            - string
      required:
        - actor
        - capture
        - counterpart
        - direction
        - error
        - exchangeId
        - poll
        - request
        - response
        - runId
        - stepKey
      type: object
    CheckResult:
      additionalProperties: false
      properties:
        checkId:
          description: stable, like 'vp.kb-jwt.aud', 'vc.signature', 'mdoc.decode'
          type: string
        code:
          description: verbatim upstream code, like 'ERR_INVALID_AUD', 'IsMissingHolderPublicKey'
          type: string
        exchangeIds:
          description: the captured exchanges the check rests on
          items:
            type: string
          type: array
        message:
          description: verbatim upstream message
          type: string
        outcome:
          description: |-
            'info' = informational, never a pass criterion, never a fail criterion, never counted in
            `stepSummary`, never counted in a verdict (first user: `vp.wallet.verifier-badges`, 03 FLOW-60, S-203)
          enum:
            - fail
            - info
            - not-run
            - pass
          type: string
        source:
          enum:
            - engine
            - playground-lint
            - verifier-response
          type: string
        specClause:
          description: spec name + section title (P7 owns tamper clauses)
          type: string
        tamper:
          additionalProperties: false
          description: present only on the single verdict.check of a tamper run (07 §6; 04 §3.5)
          properties:
            expected:
              enum:
                - accept
                - accept-permitted
                - reject
              type: string
            findings:
              description: "'code-drift' is the only value defined today"
              items:
                type: string
              type: array
            observed:
              enum:
                - accepted
                - crashed
                - no-response
                - rejected
              type: string
            reason:
