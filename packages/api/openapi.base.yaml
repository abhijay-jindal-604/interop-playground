# Hand-written route skeleton of plan/04-api-contracts.md §11 (paths, parameters, responses).
# `npm run contracts:generate` merges it with components.schemas generated from
# packages/api/src/api.ts and writes packages/api/openapi.yaml. Edit paths here, types in api.ts.
# Fixes against the 04 §11 sketch (YAML flow-style commas split two descriptions into extra keys;
# `allowReserved` is not allowed on a path parameter): quoted those descriptions, dropped allowReserved;
# top-level tags are Tag Objects ({name}), not strings.
openapi: 3.1.0
info:
  title: Interop Playground BFF API
  version: 1.0.0
  description: UI and script API of the Interop Playground (plan/04-api-contracts.md). Local single-user tool.
servers:
  - url: http://127.0.0.1:3100
    description: BFF (UI, REST, SSE, SDK proxy, return page)
  - url: https://{publicHost}:8443
    description: Gateway listener of the Inji Verify base (relay routes only)
    variables: { publicHost: { default: 192.168.0.10 } }
  - url: http://sidecar:7070
    description: Inji JVM sidecar (BFF-only, playground_net)
tags:
  [
    { name: catalog },
    { name: env },
    { name: streams },
    { name: runs },
    { name: suites },
    { name: reports },
    { name: tamper },
    { name: proxy },
    { name: relay },
    { name: sidecar },
  ]
paths:
  /api/v1/health:
    get:
      {
        operationId: getHealth,
        tags: [catalog],
        x-api-id: API-01,
        responses:
          {
            '200':
              {
                description: ok,
                content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } },
              },
          },
      }
  /api/v1/adapters:
