      {
        operationId: listAdapters,
        tags: [catalog],
        x-api-id: API-02,
        responses:
          {
            '200':
              {
                description: ok,
                content:
                  {
                    application/json:
                      { schema: { $ref: '#/components/schemas/AdapterListResponse' } },
                  },
              },
          },
      }
  /api/v1/runs/preview:
    post:
      operationId: previewRun
