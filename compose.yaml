# interop-playground bundle (plan/10 §7, 02 §2, ADR-17, ADR-22, ADR-45, ADR-48, ADR-50).
#
# Start it with scripts/up.sh, never with a bare `docker compose up`: up.sh generates certs/,
# renders .generated/config/ from docker/config/**, pulls every image by the digest in
# versions.lock and runs the ADR-14 chain. Compose is invoked as
#   docker compose -p interop-playground --env-file .env --env-file .env.local ...
#
# Profiles (10 §7.1): none = core (bff, sidecar, certify-preauth + nginx + db; Collab mode);
# local (default) = the rest of full-local mode; mdoc-spec; peers; iae (opt-in); debug.
#
# Rules enforced by tests/repo/compose-lint.test.ts (11 §4.3):
#  - only `bff` publishes host ports (two-address rule, 10 §7.3);
#  - every JVM service carries label playground.jvm, JAVA_TOOL_OPTIONS and the truststore mount (10 §7.4);
#  - every postgres/redis service mounts a named volume (RISK-07);
#  - every image is pinned in versions.lock; the develop-class Certify images are digest-locked here too (RISK-19).

name: interop-playground

x-jvm-env: &jvm-env
  JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/jvm-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"

x-jvm-labels: &jvm-labels
  playground.jvm: "true"

x-certify-env: &certify-env
  container_user: mosip
  SPRING_CONFIG_NAME: certify
  SPRING_CONFIG_LOCATION: /home/mosip/config/
  enable_certify_artifactory: "false"
  download_hsm_client: "false"

x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
  interval: 5s
  timeout: 5s
  retries: 30

x-certify-health: &certify-health
  test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8090/v1/certify/.well-known/openid-credential-issuer"]
  interval: 10s
  timeout: 5s
  retries: 60
  start_period: 60s

x-nginx-certify-health: &nginx-certify-health
  test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/.well-known/openid-credential-issuer"]
  interval: 10s
  timeout: 5s
  retries: 30

networks:
  default:
    name: playground_net

volumes:
  playground-data:
  playground-datashare:
  certify-preauth-pg:
  certify-preauth-keys:
  certify-authcode-pg:
  certify-mdoc-pg:
  certify-iae-pg:
  certify-iae-keys:
  verify-pg:
  esignet-pg:

services:
  # ---------------------------------------------------------------- core ----
  bff:
    image: interop-playground/bff:local
    build:
      context: .
      dockerfile: docker/bff.Dockerfile
    environment:
      NODE_EXTRA_CA_CERTS: /certs/playground-ca.pem
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      PLAYGROUND_MODE: ${PLAYGROUND_MODE:-local}
      BFF_LOG_LEVEL: ${BFF_LOG_LEVEL:-info}
      COLLAB_BUDGET_RPM: ${COLLAB_BUDGET_RPM:-20}
      COLLAB_ESIGNET_MOCK_UIN: ${COLLAB_ESIGNET_MOCK_UIN:-}
      COLLAB_ESIGNET_MOCK_OTP: ${COLLAB_ESIGNET_MOCK_OTP:-}
      INJI_VERIFY_REDIRECT_URI: http://127.0.0.1:3100/return/vp
      # binds 0.0.0.0 inside the container; published on 127.0.0.1:3100 only (10 §7.3)
      BFF_LISTEN_HOST: 0.0.0.0
      SIDECAR_URL: http://sidecar:7070
      DATA_DIR: /data
      FLOWS_DIR: /app/flows
      FINGERPRINTS_DIR: /app/fingerprints
      CONFIG_DIR: /config
      DATASHARE_DIR: /datashare
    volumes:
      - playground-data:/data
      - playground-datashare:/datashare
      - ./certs/playground-ca.pem:/certs/playground-ca.pem:ro
      - ./certs/gateway.pem:/certs/gateway.pem:ro
      - ./certs/gateway.key:/certs/gateway.key:ro
      - ./certs/bff-admin.token:/certs/bff-admin.token:ro
      - ./certs/peers:/certs/peers:ro
      - ./.generated/config:/config:ro
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:443:443"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:443:443"
      - "127.0.0.1:8093:8093"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8093:8093"
      - "127.0.0.1:8096:8096"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8096:8096"
      - "127.0.0.1:8097:8097"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8097:8097"
      - "127.0.0.1:8098:8098"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8098:8098"
      - "127.0.0.1:8099:8099"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8099:8099"
      - "127.0.0.1:3004:3004"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:3004:3004"
      - "127.0.0.1:3005:3005"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:3005:3005"
      - "127.0.0.1:8095:8095"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8095:8095"
      - "127.0.0.1:8443:8443"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8443:8443"
      - "127.0.0.1:18103:18103"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:18103:18103"
      - "127.0.0.1:18443:18443"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:18443:18443"
      - "127.0.0.1:18444:18444"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:18444:18444"
      - "127.0.0.1:18445:18445"
      - "${PUBLIC_HOST:?set PUBLIC_HOST in .env}:18445:18445"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  sidecar:
    image: interop-playground/sidecar:local
    build:
      context: sidecar
      dockerfile: ../docker/sidecar.Dockerfile
    labels: *jvm-labels
    environment:
      <<: *jvm-env
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
    restart: unless-stopped

  certify-preauth-db:
    image: postgres:15
    environment: *pg-env
    volumes:
      - certify-preauth-pg:/var/lib/postgresql/data
      - ./.generated/config/certify-preauth/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-health
    restart: unless-stopped

  certify-preauth:
    image: injistack/inji-certify-with-plugins:1.0.0-alpha.1
    user: root
    labels: *jvm-labels
    environment:
      <<: [*certify-env, *jvm-env]
      active_profile_env: "default, csvdp-farmer"
      mosip_certify_domain_url: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      mosip_certify_database_hostname: certify-preauth-db
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/certify-preauth/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./.generated/config/certify-preauth/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties:ro
      - ./.generated/config/certify-preauth/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./.generated/config/certify-preauth/farmer-context.json:/home/mosip/context/farmer-context.json:ro
      - certify-preauth-keys:/home/mosip/CERTIFY_PKCS12
    depends_on:
      certify-preauth-db:
        condition: service_healthy
    healthcheck: *certify-health
    restart: unless-stopped

  certify-preauth-nginx:
    image: nginx:stable
    volumes:
      - ./.generated/config/certify-preauth/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      certify-preauth:
        condition: service_healthy
    healthcheck: *nginx-certify-health
    restart: unless-stopped

  # --------------------------------------------------------------- local ----
  certify-authcode-db:
    image: postgres:15
    profiles: [local]
    environment: *pg-env
    volumes:
      - certify-authcode-pg:/var/lib/postgresql/data
      - ./.generated/config/certify-authcode/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-health
    restart: unless-stopped

  certify-authcode:
    image: injistack/inji-certify-with-plugins:1.0.0-alpha.1
    profiles: [local]
    user: root
    labels: *jvm-labels
    environment:
      <<: [*certify-env, *jvm-env]
      active_profile_env: "default, authcode"
      mosip_certify_domain_url: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8093
      mosip_certify_database_hostname: certify-authcode-db
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/certify-authcode/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./.generated/config/certify-authcode/certify-authcode.properties:/home/mosip/config/certify-authcode.properties:ro
      - ./.generated/config/certify-authcode/certify-mdlauth.properties:/home/mosip/config/certify-mdlauth.properties:ro
      - ./.generated/config/certify-authcode/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./.generated/config/certify-authcode/farmer-context.json:/home/mosip/context/farmer-context.json:ro
      - certify-preauth-keys:/home/mosip/CERTIFY_PKCS12
    depends_on:
      certify-authcode-db:
        condition: service_healthy
      # one CERTIFY_PKCS12 shared with certify-preauth (S-194): never create it concurrently
      certify-preauth:
        condition: service_healthy
    healthcheck: *certify-health
    restart: unless-stopped

  certify-authcode-nginx:
    image: nginx:stable
    profiles: [local]
    volumes:
      - ./.generated/config/certify-authcode/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.generated/config/mimoto/mimoto-issuers-config.json:/config/server/mimoto-issuers-config.json:ro
      - ./.generated/config/mimoto/mimoto-trusted-verifiers.json:/config/server/mimoto-trusted-verifiers.json:ro
      - ./.generated/config/mimoto/credential-template.html:/config/server/credential-template.html:ro
    depends_on:
      certify-authcode:
        condition: service_healthy
    healthcheck: *nginx-certify-health
    restart: unless-stopped

  datashare-service:
    image: nginx:stable
    profiles: [local]
    volumes:
      - playground-datashare:/data:ro
      - ./docker/datashare/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8097/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mimoto:
    image: injistack/mimoto:1.0.0-alpha.1
    profiles: [local]
    user: root
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      container_user: mosip
      active_profile_env: default
      SPRING_CONFIG_NAME: mimoto
      SPRING_CONFIG_LOCATION: /home/mosip/
      SPRING_CLOUD_BOOTSTRAP_LOCATION: /home/mosip/mimoto-bootstrap.properties
      oidc_p12_password: ${ESIGNET_KEYSTORE_PASSWORD:?run scripts/up.sh (writes .env.local)}
      WALLET_BINDING_PARTNER_API_KEY: dummywalletbindingpartnerapikey
      SPRING_DATASOURCE_URL: jdbc:postgresql://certify-authcode-db:5432/inji_mimoto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GOOGLE_OAUTH_CLIENT_ID: playground-inji-web
      GOOGLE_OAUTH_CLIENT_SECRET: not-a-secret
      # Google stand-in (S-025): browser leg on localhost, back channel through the gateway
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_AUTHORIZATION_URI: http://localhost:8095/authorize
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8095/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_USER_INFO_URI: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8095/userinfo
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_JWK_SET_URI: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8095/jwks
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/mimoto/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./.generated/config/mimoto/mimoto-bootstrap.properties:/home/mosip/mimoto-bootstrap.properties:ro
      - ./.generated/config/mimoto/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./.generated/config/mimoto/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ./.generated/config/mimoto/mosip-cbeff.xsd:/home/mosip/mosip-cbeff.xsd:ro
      # read-write: Mimoto's keymanager stores its ROOT/master keys into this same p12 at first
      # boot (KER-KMA-003 "Read-only file system" with :ro); aliases go to inji_mimoto (ADR-54)
      - ./certs/esignet/oidckeystore.p12:/home/mosip/certs/oidckeystore.p12
    depends_on:
      certify-authcode-db:
        condition: service_healthy
      certify-authcode-nginx:
        condition: service_healthy
      datashare-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8099/v1/mimoto/issuers"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    # ADR-14: Mimoto is never restarted (KER-KMA-004 trap, S-150); up.sh uses down + up.
    restart: "no"

  inji-web:
    image: injistack/inji-web:1.0.0-alpha.1
    profiles: [local]
    environment:
      DEFAULT_LANG: en
      # baked origin: the browser must use localhost:3004 (Mimoto CORS, S-105)
      MIMOTO_URL: http://localhost:8099/v1/mimoto
    volumes:
      - ./.generated/config/mimoto/mimoto-default.properties:/home/mosip/mimoto-default.properties:ro
      - ./.generated/config/mimoto/mimoto-issuers-config.json:/home/mosip/mimoto-issuers-config.json:ro
      - ./.generated/config/mimoto/mimoto-trusted-verifiers.json:/home/mosip/mimoto-trusted-verifiers.json:ro
      - ./.generated/config/mimoto/credential-template.html:/home/mosip/credential-template.html:ro
      - ./.generated/config/inji-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mimoto:
        condition: service_healthy
    healthcheck:
      # backend well-known through Inji Web's own proxy, never the UI page alone (ADR-05)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3004/v1/mimoto/issuers"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  verify-db:
    image: postgres:13
    profiles: [local]
    environment:
      <<: *pg-env
      POSTGRES_DB: inji_verify
    volumes:
      - verify-pg:/var/lib/postgresql/data
      - ./.generated/config/verify/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-health
    restart: unless-stopped

  verify-service:
    image: injistack/inji-verify-service:1.0.0-alpha.1
    profiles: [local]
    user: root
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      active_profile_env: default
      DATABASE_HOST: verify-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: inji_verify
      DATABASE_SCHEMA: verify
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      INJI_VP_REQUEST_LONG_POLLING_TIMEOUT: "55000"
      INJI_VP_SUBMISSION_BASE_URL: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8443/v1/verify
      SERVER_SERVLET_CONTEXT_PATH: /v1/verify
      INJI_DID_VERIFY_URI: did:web:${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      INJI_DID_VERIFY_PUBLIC_KEY_URI: did:web:${PUBLIC_HOST:?set PUBLIC_HOST in .env}#key-0
      INJI_KEYSTORE_FILE_PASS: mosip
      INJI_VERIFY_REDIRECT_URI: http://127.0.0.1:3100/return/vp
      INJI_VERIFY_RESPONSE_CODE_EXPIRY_TIME_IN_MINS: "5"
      INJI_VERIFY_CLAIMS_WITH_META_DATA: _sd,_sd_alg,iss,cnf,sub,aud,exp,nbf,iat,cti
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
    depends_on:
      verify-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/verify/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  esignet-db:
    image: postgres:bookworm
    profiles: [local]
    environment: *pg-env
    volumes:
      # postgres:bookworm at the locked digest is PostgreSQL 18, whose image declares
      # VOLUME /var/lib/postgresql and refuses a mount at .../data (G-125)
      - esignet-pg:/var/lib/postgresql
      - ./.generated/config/esignet/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-health
    restart: unless-stopped

  esignet-redis:
    image: redis:6.0
    profiles: [local]
    # eSignet keeps only short-lived transactions in Redis (persistence off); it shares the eSignet
    # state volume (10 §7.2) so RISK-07's "every DB mounts a named volume" holds and --reset wipes both together
    volumes:
      - esignet-pg:/data
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mock-identity-system:
    image: mosipid/mock-identity-system:0.13.0
    profiles: [local]
    user: root
    # G-141: configure_start.sh unzips client.zip and moves it to hsm-client on every start; after a
    # container restart (not recreate) the leftovers make unzip prompt without a TTY and exit 1
    # (crash loop). Remove them first; command = the image's CMD (an entrypoint override clears it).
    entrypoint: ["/bin/bash", "-c", "rm -rf /home/mosip/client /home/mosip/hsm-client && exec ./configure_start.sh \"$$@\"", "configure_start"]
    command: ["/bin/sh", "-c", "java -jar -Dloader.path=\"$${loader_path_env}\" -Dspring.cloud.config.label=\"$${spring_config_label_env}\" -Dspring.profiles.active=\"$${active_profile_env}\" -Dspring.cloud.config.uri=\"$${spring_config_url_env}\" mock-identity-system.jar"]
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      container_user: mosip
      active_profile_env: default,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://esignet-db:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MOSIP_MOCK_IDA_KYC_TRANSACTION_TIMEOUT_SECS: "900"
      MOSIP_ESIGNET_HOST: localhost:8088
      MOSIP_MOCK_IDA_KYC_PSUT_FIELD: individualId
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
    depends_on:
      esignet-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8082/v1/mock-identity-system/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  esignet:
    image: mosipid/esignet-with-plugins:1.8.0
    profiles: [local]
    user: root
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      container_user: mosip
      active_profile_env: default,local
      plugin_name_env: esignet-mock-plugin.jar
      MOSIP_ESIGNET_DATABASE_URL: jdbc:postgresql://esignet-db:5432/mosip_esignet?currentSchema=esignet
      MOSIP_ESIGNET_DATABASE_USERNAME: postgres
      MOSIP_ESIGNET_DATABASE_PASSWORD: postgres
      MOSIP_ESIGNET_MOCK_DOMAIN_URL: http://mock-identity-system:8082
      MOSIP_ESIGNET_INTEGRATION_KEY_BINDER: MockKeyBindingWrapperService
      SPRING_CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: esignet-redis
      SPRING_REDIS_HOST: esignet-redis
      SPRING_REDIS_PASSWORD: ""
      KAFKA_ENABLED: "false"
      MOSIP_ESIGNET_DOMAIN_URL: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:3005
      MOSIP_ESIGNET_SUPPORTED_CREDENTIAL_SCOPES: "{'mosip_identity_vc_ldp','mock_identity_vc_ldp'}"
      MOSIP_ESIGNET_CREDENTIAL_SCOPE_RESOURCE_MAPPING: "{'mosip_identity_vc_ldp':'http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:3005/v1/esignet/vci/credential','mock_identity_vc_ldp':'http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8093/v1/certify/issuance/credential'}"
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
    depends_on:
      esignet-db:
        condition: service_healthy
      esignet-redis:
        condition: service_healthy
      mock-identity-system:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8088/v1/esignet/oidc/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  esignet-ui:
    image: mosipid/oidc-ui:1.8.0
    profiles: [local]
    user: root
    environment:
      container_user: mosip
      DEFAULT_WELLKNOWN: "%5B%7B%22name%22%3A%22OpenID%20Configuration%22%2C%22value%22%3A%22%2F.well-known%2Fopenid-configuration%22%7D%2C%7B%22name%22%3A%22Jwks%20Json%22%2C%22value%22%3A%22%2F.well-known%2Fjwks.json%22%7D%2C%7B%22name%22%3A%22Authorization%20Server%22%2C%22value%22%3A%22%2F.well-known%2Foauth-authorization-server%22%7D%5D"
      SIGN_IN_WITH_ESIGNET_PLUGIN_URL: https://raw.githubusercontent.com/mosip/artifactory-ref-impl/master/artifacts/src/mosip-plugins/sign-in-with-esignet/sign-in-with-esignet.zip
    volumes:
      - ./.generated/config/esignet-ui/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      esignet:
        condition: service_healthy
    healthcheck:
      # eSignet's backend well-known through the UI's nginx (ADR-05)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  oauth2-mock:
    image: interop-playground/oauth2-mock:local
    profiles: [local]
    build:
      context: docker/oauth2-mock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ----------------------------------------------------------- mdoc-spec ----
  certify-mdoc-db:
    image: postgres:15
    profiles: [mdoc-spec]
    environment: *pg-env
    volumes:
      - certify-mdoc-pg:/var/lib/postgresql/data
      - ./.generated/config/certify-mdoc/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-health
    restart: unless-stopped

  certify-mdoc:
    # develop-class Certify, digest-locked (ADR-17, RISK-19); the tag moves, the digest does not
    image: injistackdev/inji-certify-with-plugins:develop@sha256:3e45d85b2a1d258fbe8234b32778a878ff19dfcc493698d456a6bf2f76c85e65
    profiles: [mdoc-spec]
    user: root
    labels: *jvm-labels
    environment:
      <<: [*certify-env, *jvm-env]
      active_profile_env: "default, csvdp-farmer"
      mosip_certify_domain_url: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8097
      mosip_certify_database_hostname: certify-mdoc-db
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/certify-mdoc/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./.generated/config/certify-mdoc/certify-csvdp-farmer.properties:/home/mosip/config/certify-csvdp-farmer.properties:ro
      - ./.generated/config/certify-mdoc/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./.generated/config/certify-mdoc/farmer-context.json:/home/mosip/context/farmer-context.json:ro
    depends_on:
      certify-mdoc-db:
        condition: service_healthy
    healthcheck: *certify-health
    restart: unless-stopped

  certify-mdoc-nginx:
    image: nginx:stable
    profiles: [mdoc-spec]
    volumes:
      - ./.generated/config/certify-mdoc/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      certify-mdoc:
        condition: service_healthy
    healthcheck: *nginx-certify-health
    restart: unless-stopped

  # ----------------------------------------------------------------- iae ----
  certify-iae-db:
    image: postgres:15
    profiles: [iae]
    environment: *pg-env
    volumes:
      - certify-iae-pg:/var/lib/postgresql/data
      - ./.generated/config/certify-iae/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck: *pg-health
    restart: unless-stopped

  certify-iae-mint:
    # the S-206 develop-class digest (ADR-50, RISK-39), digest-locked
    image: injistackdev/inji-certify-with-plugins:develop@sha256:764653071d76787e85019923fd2bd67ce0555cc8ffcbe127c0d6bb20f4795bca
    profiles: [iae]
    user: root
    labels: *jvm-labels
    environment:
      <<: [*certify-env, *jvm-env]
      active_profile_env: "default, iae-mint"
      mosip_certify_domain_url: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8096
      mosip_certify_database_hostname: certify-iae-db
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/certify-iae-mint/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./.generated/config/certify-iae-mint/certify-iae-mint.properties:/home/mosip/config/certify-iae-mint.properties:ro
      - ./.generated/config/certify-iae-mint/farmer_identity_data.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./.generated/config/certify-iae-mint/farmer-context.json:/home/mosip/context/farmer-context.json:ro
      - certify-iae-keys:/home/mosip/CERTIFY_PKCS12
    depends_on:
      certify-iae-db:
        condition: service_healthy
    healthcheck: *certify-health
    restart: unless-stopped

  certify-iae:
    image: injistackdev/inji-certify-with-plugins:develop@sha256:764653071d76787e85019923fd2bd67ce0555cc8ffcbe127c0d6bb20f4795bca
    profiles: [iae]
    user: root
    labels: *jvm-labels
    environment:
      <<: [*certify-env, *jvm-env]
      # Spring profile `iae`, never `certify-iae` (S-206)
      active_profile_env: "default, iae"
      mosip_certify_domain_url: http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:8098
      mosip_certify_database_hostname: certify-iae-db
      mosip_certify_vp-request_config-file-url: http://certify-iae-nginx:82/vp_request_config-dcql-ldp.json
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/certify-iae/certify-default.properties:/home/mosip/config/certify-default.properties:ro
      - ./.generated/config/certify-iae/certify-iae.properties:/home/mosip/config/certify-iae.properties:ro
      - ./.generated/config/certify-iae/farmer_identity_data-iae.csv:/home/mosip/config/farmer_identity_data.csv:ro
      - ./.generated/config/certify-iae/farmer-context.json:/home/mosip/context/farmer-context.json:ro
      - certify-iae-keys:/home/mosip/CERTIFY_PKCS12
    depends_on:
      certify-iae-db:
        condition: service_healthy
      certify-iae-mint:
        condition: service_healthy
    healthcheck: *certify-health
    restart: unless-stopped

  certify-iae-nginx:
    image: nginx:stable
    profiles: [iae]
    volumes:
      - ./.generated/config/certify-iae/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.generated/config/certify-iae/vpcfg:/cfg:ro
    depends_on:
      certify-iae-mint:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:81/.well-known/openid-credential-issuer && curl -fsS -o /dev/null http://127.0.0.1:82/vp_request_config-dcql-ldp.json"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # --------------------------------------------------------------- peers ----
  waltid-issuer-api2:
    image: waltid/issuer-api2:1.1.0
    profiles: [peers]
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      SERVICE_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/waltid-issuer:/waltid-issuer-api2/config:ro
      - ./certs/peers/waltid-issuer.key:/certs/peers/waltid-issuer.key:ro
      - ./certs/peers/waltid-issuer.pem:/certs/peers/waltid-issuer.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/.well-known/openid-credential-issuer/openid4vci"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  waltid-verifier-api2:
    # unsigned redirect_uri: client, serves wallet.playground-ts on 18443 (ADR-48)
    image: waltid/verifier-api2:1.1.0
    profiles: [peers]
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      VERIFIER_API2_PORT: "8080"
      SERVICE_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/waltid-verifier:/waltid-verifier-api2/config:ro
    healthcheck: &waltid-verifier-health
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  waltid-verifier-api2-signed:
    # Ed25519-signed decentralized_identifier:did:key client, serves wallet.inji-jvm on 18445 (ADR-48, S-205)
    image: waltid/verifier-api2:1.1.0
    profiles: [peers]
    labels: *jvm-labels
    environment:
      <<: *jvm-env
      VERIFIER_API2_PORT: "8080"
      SERVICE_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/waltid-verifier-signed:/waltid-verifier-api2/config:ro
      - ./certs/peers/waltid-verifier-ed25519.json:/certs/peers/waltid-verifier-ed25519.json:ro
    healthcheck: *waltid-verifier-health
    restart: unless-stopped

  eudi-verifier:
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:v0.11.0
    profiles: [peers]
    labels: *jvm-labels
    env_file: [docker/config/eudi/eudi.env]
    environment:
      <<: *jvm-env
      VERIFIER_PUBLICURL: https://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:18444
      VERIFIER_DEFAULTHTTPRESPONSEMODE: DirectPost
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE: file:///certs/keystore.jks
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_TYPE: jks
      VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD: keystore
      VERIFIER_ACCESS_CERTIFICATE_ALIAS: access_certificate
      VERIFIER_ACCESS_CERTIFICATE_PASSWORD: access_certificate
      VERIFIER_ACCESS_CERTIFICATE_SIGNING_ALGORITHM: ES512
      VERIFIER_INTENDEDUSES_0_ID: "1"
      VERIFIER_INTENDEDUSES_0_DESCRIPTION: interop-playground
      VERIFIER_ATTESTATIONCLASSIFICATIONS_EAA_0_USECASE: interopPlayground
      VERIFIER_ATTESTATIONCLASSIFICATIONS_EAA_0_VCTS: PlaygroundSdJwt,http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:18103/openid4vci/identity_credential
    volumes:
      - ./certs/jvm-truststore.p12:/certs/jvm-truststore.p12:ro
      - ./.generated/config/eudi/eudi-keystore.jks:/certs/keystore.jks:ro
    # distroless image (no shell, no curl): readiness is probed from up.sh through another container
    restart: unless-stopped

  # --------------------------------------------------------------- debug ----
  inji-verify-ui:
    image: injistack/inji-verify-ui:1.0.0-alpha.1
    profiles: [debug]
    # developer-only: loopback publishing is allowed in the debug profile (02 §2.3)
    ports:
      - "127.0.0.1:3000:8000"
    environment:
      DEFAULT_TITLE: Inji Verify
      DEFAULT_LANG: en
      VERIFIABLE_CLAIMS_CONFIG_URL: /assets/config.json
      VP_SUBMISSION_SUPPORTED: "false"
      CLIENT_ID: inji-verify-ui
      DISPLAY_TIMEOUT: "120000"
      ENABLE_DC_API: "false"
    depends_on:
      verify-service:
        condition: service_healthy
        required: false
    restart: unless-stopped
